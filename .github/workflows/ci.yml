name: Work Hub CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [source, browser]
    env:
      GIT_MASTER: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: bash scripts/ci/${{ matrix.lane }}.bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.lane == 'browser'
        with:
          name: simulator-browser-${{ github.sha }}
          path: test-results/browser-ci/
          if-no-files-found: error
          retention-days: 7
