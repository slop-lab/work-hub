schemaVersion: 1
repositories:
  main:
    ref: main
    upstream: {url: https://github.com/slop-lab/work-hub.git, branch: main}
    publish: {main: main}
    defaultBranch: main
    protect: [main, development]
    branches:
      main: {review: true}
      development: {review: false}
policy:
  code-review:
    requiredReviewerIds: [mjy]
    pathReviewerRules: []
  merge-policy: {}
  git-ci:
    ciRepositoryIds: [main]
    requiredJobs:
      - name: source
        kind: ordinary-sysbox
        evidenceClass: candidate-controlled
      - name: browser
        kind: ordinary-sysbox
        evidenceClass: candidate-controlled
